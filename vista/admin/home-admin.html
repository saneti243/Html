<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
    
        .admin-dashboard { display: flex; gap: 20px; padding: 40px; justify-content: center; }
        .admin-module { background: #fff; padding: 30px; border-radius: 8px; border: 1px solid var(--border-color); flex: 1; max-width: 400px; text-align: center; }
        .admin-module h3 { color: var(--primary-color); margin-bottom: 20px; }
        .admin-menu { list-style: none; padding: 0; }
        .admin-menu li { margin-bottom: 10px; }
        .admin-menu a { display: block; padding: 10px; background-color: var(--gray-bg); color: var(--text-main); text-decoration: none; border-radius: 4px; transition: 0.3s; }
        .admin-menu a:hover { background-color: var(--primary-color); color: #fff; }
    </style>
</head>
<body>
    <header style="background-color: #d4edda; border-bottom-color: #c3e6cb;">
        <div class="logo">⚙️ ADMIN PANEL</div>
        <nav>
            <ul>
                <li><a href="home-admin.html">Dashboard</a></li>
                <li><a href="../../index.html">Ver Tienda</a></li>
            </ul>
        </nav>
        <div class="auth-links">
            <a href="../../index.html" style="color: red;">Cerrar sesión</a>
        </div>
    </header>

    <main>
        <h1 style="text-align: center; margin-top: 40px;">Bienvenido Administrador</h1>
        
        <section class="admin-dashboard">
            <div class="admin-module">
                <h3>Gestión de Productos</h3>
                <ul class="admin-menu">
                    <li><a href="nuevo-producto.html">Nuevo Producto</a></li>
                    <li><a href="#">Editar Producto</a></li>
                    <li><a href="#">Mostrar Producto</a></li>
                </ul>
            </div>

            <div class="admin-module">
                <h3>Gestión de Usuarios</h3>
                <ul class="admin-menu">
                    <li><a href="nuevo-usuario.html">Nuevo Usuario</a></li>
                    <li><a href="#">Editar Usuario</a></li>
                    <li><a href="#">Mostrar Usuario</a></li>
                </ul>
            </div>
        </section>
    </main>

</body>
</html>
