<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto - Admin Panel</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <header style="background-color: #d4edda; border-bottom-color: #c3e6cb;">
        <div class="logo">⚙️ ADMIN PANEL</div>
        <nav>
            <ul>
                <li><a href="home-admin.html">Dashboard</a></li>
                <li><a href="../../index.html">Ver Tienda</a></li>
            </ul>
        </nav>
        <div class="auth-links">
            <a href="../../index.html" style="color: red;">Cerrar sesión</a>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2 style="background-color: #c3e6cb; color: #155724;">Registrar Nuevo Producto</h2>
            
            <form id="form-nuevo-producto">
                <div class="form-group">
                    <label for="nombre-prod">NOMBRE DEL PRODUCTO</label>
                    <input type="text" id="nombre-prod" name="nombre-prod" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="precio-prod">PRECIO ($)</label>
                        <input type="number" id="precio-prod" name="precio-prod" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="categoria-prod">CATEGORÍA</label>
                        <select id="categoria-prod" name="categoria-prod" required>
                            <option value="">Seleccione...</option>
                            <option value="Audio">Audio Personal</option>
                            <option value="Calzado">Calzado / Streetwear</option>
                            <option value="Videojuegos">Videojuegos Digitales</option>
                            <option value="Mascotas">Mascotas / Hogar</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="desc-prod">DESCRIPCIÓN</label>
                    <textarea id="desc-prod" name="desc-prod" rows="4" style="width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; resize: vertical;" required></textarea>
                </div>

                <div class="form-group">
                    <label for="img-prod">URL DE LA IMAGEN</label>
                    <input type="url" id="img-prod" name="img-prod" placeholder="https://ejemplo.com/imagen.jpg">
                </div>

                <button type="submit" class="btn btn-add" style="background-color: #28a745;">GUARDAR PRODUCTO</button>
                <a href="home-admin.html" class="btn" style="display: block; text-align: center; margin-top: 10px; background-color: #6c757d;">Volver al Dashboard</a>
            </form>
        </div>
    </main>

    <script src="../../js/validaciones.js"></script>

</body>
</html>
