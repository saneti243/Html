<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .carrito-container {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .item-carrito {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--gray-bg);
        }
        .total-carrito {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
        .btn-eliminar-item {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-eliminar-item:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">■ Site Name</div>
        <nav>
            <ul>
                <li><a href="../../index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="cart">
            <a href="carrito.html">🛒 Cart (<span id="contador-carrito">0</span>)</a>
        </div>
        <div class="auth-links">
            <a href="login.html">Iniciar sesión</a> | 
            <a href="registro.html">Registrar usuario</a>
        </div>
    </header>

    <main>
        <div class="carrito-container">
            <h2 style="margin-bottom: 20px;">Tu Carrito de Compras</h2>
            
            <div id="lista-carrito">
                <p style="color: #6c757d;">Tu carrito está vacío actualmente.</p>
            </div>

            <div class="total-carrito" id="total-carrito">
                Total: $0
            </div>
            
            <div id="checkout-section" style="display: none; margin-top: 30px; border-top: 2px solid var(--gray-bg); padding-top: 20px;">
                <h3 style="margin-bottom: 20px; color: var(--primary-color);">Datos de Facturación y Envío</h3>
                
                <form id="form-pago" onsubmit="procesarPago(event)">
                    <div class="form-group">
                        <label for="nombre-pago">NOMBRE COMPLETO</label>
                        <input type="text" id="nombre-pago" required placeholder="Ej: Arturo Ignacio Cabello" oninput="formatNombre(event)">
                    </div>
                    
                    <div class="form-row" style="display: flex; gap: 15px;">
                        <div class="form-group" style="flex: 1;">
                            <label for="rut-pago">RUT</label>
                            <input type="text" id="rut-pago" required placeholder="12345678-9" maxlength="10" oninput="formatRut(event)">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="dir-pago">DIRECCIÓN DE ENVÍO</label>
                            <input type="text" id="dir-pago" required placeholder="Ej: Av. Providencia, Santiago">
                        </div>
                    </div>

                    <h3 style="margin: 20px 0 15px; color: var(--primary-color);">Método de Pago</h3>
                    
                    <div class="form-group">
                        <label for="tarjeta-pago">NÚMERO DE TARJETA</label>
                        <input type="text" id="tarjeta-pago" required placeholder="0000 0000 0000 0000" maxlength="19" pattern="\d{4} \d{4} \d{4} \d{4}" oninput="formatTarjeta(event)">
                    </div>
                    
                    <div class="form-row" style="display: flex; gap: 15px;">
                        <div class="form-group" style="flex: 1;">
                            <label for="vencimiento-pago">FECHA DE VENCIMIENTO</label>
                            <input type="text" id="vencimiento-pago" required placeholder="MM/AA" maxlength="5" oninput="formatVencimiento(event)">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="cvv-pago">CVV</label>
                            <input type="password" id="cvv-pago" required placeholder="123" maxlength="3" pattern="\d{3}">
                        </div>
                    </div>
                    
                    <div style="text-align: right; margin-top: 20px;">
                        <button type="submit" class="btn btn-add" style="width: auto; padding: 12px 30px; background-color: #28a745; font-size: 16px;">Confirmar y Pagar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../../js/carrito.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderizarListaCarrito();
        });

        function formatNombre(e) {
            e.target.value = e.target.value.replace(/[0-9]/g, '');
        }

        function formatRut(e) {
            let valor = e.target.value.replace(/[^0-9kK]/g, '').toUpperCase();
            if (valor.length > 1) {
                e.target.value = valor.slice(0, -1) + '-' + valor.slice(-1);
            } else {
                e.target.value = valor;
            }
        }

        function formatTarjeta(e) {
            let valor = e.target.value.replace(/\D/g, '');
            let formateado = [];
            for (let i = 0; i < valor.length; i += 4) {
                formateado.push(valor.substring(i, i + 4));
            }
            e.target.value = formateado.join(' ');
        }

        function formatVencimiento(e) {
            let valor = e.target.value.replace(/\D/g, '');
            if (valor.length > 2) {
                e.target.value = valor.slice(0, 2) + '/' + valor.slice(2, 4);
            } else {
                e.target.value = valor;
            }
        }

        function eliminarDelCarrito(index) {
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            carrito.splice(index, 1);
            localStorage.setItem('carrito', JSON.stringify(carrito));
            renderizarListaCarrito();
            actualizarContadorCarrito();
        }

        function renderizarListaCarrito() {
            const listaCarrito = document.getElementById('lista-carrito');
            const contenedorTotal = document.getElementById('total-carrito');
            const checkoutSection = document.getElementById('checkout-section');
            
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            
            if (carrito.length > 0) {
                listaCarrito.innerHTML = ''; 
                let total = 0;

                carrito.forEach((producto, index) => {
                    total += producto.precio;
                    
                    const div = document.createElement('div');
                    div.className = 'item-carrito';
                    div.innerHTML = `
                        <div>
                            <strong>${producto.nombre}</strong>
                            <p style="font-size: 14px; color: gray;">${producto.categoria || 'Sin categoría'}</p>
                        </div>
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <span>$${producto.precio.toLocaleString('es-CL')}</span>
                            <button type="button" class="btn-eliminar-item" onclick="eliminarDelCarrito(${index})" title="Eliminar producto">X</button>
                        </div>
                    `;
                    listaCarrito.appendChild(div);
                });

                contenedorTotal.innerText = `Total: $${total.toLocaleString('es-CL')}`;
                checkoutSection.style.display = 'block';
            } else {
                listaCarrito.innerHTML = '<p style="color: #6c757d;">Tu carrito está vacío actualmente.</p>';
                contenedorTotal.innerText = 'Total: $0';
                checkoutSection.style.display = 'none';
            }
        }

        function procesarPago(e) {
            e.preventDefault();
            
            let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            
            if (carrito.length === 0) {
                alert("Ocurrió un error. El carrito está vacío.");
                return;
            }

            const vencimiento = document.getElementById('vencimiento-pago').value;
            const partes = vencimiento.split('/');
            
            if (partes.length !== 2) {
                alert("Formato de fecha de vencimiento inválido. Use MM/AA.");
                return;
            }

            const mes = parseInt(partes[0], 10);
            const anio = parseInt(partes[1], 10);
            
            const fechaActual = new Date();
            const mesActual = fechaActual.getMonth() + 1;
            const anioActual = parseInt(fechaActual.getFullYear().toString().slice(2));

            if (mes < 1 || mes > 12) {
                alert("El mes de vencimiento debe estar entre 01 y 12.");
                return;
            }

            if (anio < anioActual || (anio === anioActual && mes < mesActual)) {
                alert("No se puede procesar el pago: La tarjeta está vencida.");
                return;
            }

            const nombre = document.getElementById('nombre-pago').value;
            alert(`¡Pago autorizado!\n\nGracias por tu compra, ${nombre}. Hemos enviado los detalles del pedido y la boleta a tu correo electrónico registrado.`);
            
            localStorage.removeItem('carrito');
            window.location.href = "../../index.html";
        }
    </script>

</body>
</html>
