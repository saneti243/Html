<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tienda Online</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <header>
        <div class="logo">■ Site Name</div>
        <nav>
            <ul>
                <li><a href="../../index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="cart">
            <a href="carrito.html">🛒 Cart (<span id="contador-carrito">0</span>)</a>
        </div>
        <div class="auth-links">
            <a href="login.html">Iniciar sesión</a> | 
            <a href="registro.html">Registrar usuario</a>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2>Registro de usuario</h2>
            <form id="form-registro">
                <div class="form-group">
                    <label for="nombre">NOMBRE COMPLETO</label>
                    <input type="text" id="nombre" required>
                    <div id="error-nombre" style="color: red; display: none; font-size: 12px; margin-top: 5px;"></div>
                </div>

                <div class="form-group">
                    <label for="run">RUN</label>
                    <input type="text" id="run" required placeholder="Ej: 19011022K sin guion" maxlength="9" oninput="this.value = this.value.replace(/[^0-9kK]/g, '').toUpperCase()">
                    <div id="error-run" style="color: red; display: none; font-size: 12px; margin-top: 5px;"></div>
                </div>

                <div class="form-group">
                    <label for="correo">CORREO</label>
                    <input type="email" id="correo" required>
                    <div id="error-correo" style="color: red; display: none; font-size: 12px; margin-top: 5px;"></div>
                </div>

                <div class="form-group">
                    <label for="password">CONTRASEÑA</label>
                    <input type="password" id="password" required>
                    <div id="error-password" style="color: red; display: none; font-size: 12px; margin-top: 5px;"></div>
                </div>

                <div class="form-row" style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="region">REGIÓN</label>
                        <select id="region" required></select>
                        <div id="error-region" style="color: red; display: none; font-size: 12px; margin-top: 5px;"></div>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="comuna">COMUNA</label>
                        <select id="comuna" required></select>
                        <div id="error-comuna" style="color: red; display: none; font-size: 12px; margin-top: 5px;"></div>
                    </div>
                </div>

                <button type="submit" class="btn btn-add">REGISTRAR</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Tienda Online. Todos los derechos reservados.</p>
    </footer>

    <script src="../../js/validaciones.js"></script>
    <script src="../../js/carrito.js"></script>
</body>
</html>
